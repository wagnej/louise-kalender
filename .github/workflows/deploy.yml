# Builds the site and publishes it to GitHub Pages on every push to main.
# Audio is pulled from the private repo wagnej/louise-kalender-assets at build time
# (so songs stay out of the public source repo).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch private audio assets
        uses: actions/checkout@v4
        with:
          repository: wagnej/louise-kalender-assets
          token: ${{ secrets.ASSETS_TOKEN }}
          path: _assets

      - name: Copy audio into public/
        run: |
          mkdir -p public/audio
          cp -R _assets/audio/. public/audio/

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
